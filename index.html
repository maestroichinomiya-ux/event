<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>催事スケジュール管理 - 良平堂</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --surface-alt: #faf8f5;
  --border: #e0dbd3;
  --border-light: #ece8e1;
  --text: #2c2820;
  --text-muted: #7a7268;
  --text-light: #a09889;
  --accent: #b8860b;
  --accent-hover: #9a7009;
  --accent-light: #f5ecd8;
  --danger: #c44;
  --danger-hover: #a33;
  --success: #3a8;
  --cat-tokai: #4a7ab5;
  --cat-tokai-light: #dce8f4;
  --cat-kanto: #5a9e6f;
  --cat-kanto-light: #ddf0e3;
  --cat-kansai: #c47d2e;
  --cat-kansai-light: #f5e8d4;
  --cat-other: #888;
  --cat-other-light: #e8e8e8;
  --cat-special: #9b59b6;
  --cat-special-light: #ede0f4;
  --shadow-sm: 0 1px 3px rgba(44,40,32,0.06);
  --shadow-md: 0 4px 12px rgba(44,40,32,0.08);
  --shadow-lg: 0 8px 24px rgba(44,40,32,0.12);
  --radius: 6px;
  --radius-lg: 10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden;}

/* ===== Setup ===== */
.setup-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.setup-overlay.hidden{display:none;}
.setup-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:32px;max-width:520px;width:100%;}
.setup-card h1{font-family:'Zen Maru Gothic',serif;font-size:20px;margin-bottom:8px;}
.setup-card p{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.7;}
.setup-card .form-group{margin-bottom:16px;}
.setup-card label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:5px;}
.setup-card input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:14px;color:var(--text);}
.setup-card input:focus{outline:none;border-color:var(--accent);}
.setup-card .btn{width:100%;justify-content:center;padding:12px;font-size:14px;margin-top:8px;}
.setup-error{color:var(--danger);font-size:12px;margin-top:8px;display:none;}

/* ===== Header ===== */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);gap:8px;}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.header h1{font-family:'Zen Maru Gothic',serif;font-size:17px;font-weight:700;letter-spacing:0.02em;white-space:nowrap;}
.year-select{font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer;}
.header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.sync-status{font-size:10px;color:var(--text-light);display:flex;align-items:center;gap:4px;white-space:nowrap;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.sync-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.user-badge{font-size:10px;padding:2px 8px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;color:var(--text-muted);white-space:nowrap;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:none;border-radius:var(--radius);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s ease;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--surface-alt);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:var(--danger-hover);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

/* ===== Mobile menu button ===== */
.menu-btn{display:none;width:36px;height:36px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);cursor:pointer;flex-shrink:0;font-size:18px;color:var(--text-muted);}

/* ===== Main Layout ===== */
.main{display:flex;height:calc(100vh - 53px);}

/* ===== Sidebar ===== */
.sidebar{width:300px;min-width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform 0.25s ease;}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;}
.sidebar-header h2{font-size:14px;font-weight:700;}
.event-count{font-size:12px;color:var(--text-muted);background:var(--surface-alt);padding:2px 8px;border-radius:10px;}
.sidebar-filters{padding:8px 16px;border-bottom:1px solid var(--border-light);display:flex;gap:5px;flex-wrap:wrap;}
.filter-chip{font-size:11px;padding:3px 9px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all 0.15s;font-family:inherit;color:var(--text-muted);}
.filter-chip:hover{border-color:var(--accent);color:var(--accent);}
.filter-chip.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
.event-list{flex:1;overflow-y:auto;padding:6px 10px;}
.event-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;transition:background 0.1s;border:1px solid transparent;margin-bottom:2px;}
.event-item:hover{background:var(--surface-alt);}
.event-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.event-item-info{flex:1;min-width:0;}
.event-item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-item-date{font-size:11px;color:var(--text-muted);}
.event-item-actions{display:flex;gap:4px;opacity:0;transition:opacity 0.15s;}
.event-item:hover .event-item-actions{opacity:1;}
.icon-btn{width:28px;height:28px;border:none;background:transparent;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;transition:all 0.1s;}
.icon-btn:hover{background:var(--border-light);color:var(--text);}
.icon-btn.delete:hover{background:#fde8e8;color:var(--danger);}
.import-section{padding:12px 16px;border-top:1px solid var(--border-light);}
.import-section summary{font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer;list-style:none;}
.import-section summary::-webkit-details-marker{display:none;}
.import-area{margin-top:10px;}
.import-area textarea{width:100%;height:90px;padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-family:'Zen Kaku Gothic New',monospace;font-size:12px;resize:vertical;color:var(--text);}
.import-area textarea:focus{outline:none;border-color:var(--accent);}
.import-hint{font-size:11px;color:var(--text-light);margin-top:4px;line-height:1.5;}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border-light);display:flex;gap:6px;}

/* ===== Calendar ===== */
.calendar-area{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch;}
.month-block{margin-bottom:20px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border-light);overflow:hidden;}
.month-header{padding:8px 16px;background:var(--surface-alt);border-bottom:1px solid var(--border-light);font-family:'Zen Maru Gothic',serif;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.month-add-btn{width:26px;height:26px;border:1px solid var(--border);background:var(--surface);border-radius:4px;cursor:pointer;font-size:16px;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.month-add-btn:hover{background:var(--accent-light);border-color:var(--accent);}
.calendar-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.day-header-row{display:grid;border-bottom:1px solid var(--border-light);}
.day-header{text-align:center;padding:4px 0;font-size:11px;font-weight:500;color:var(--text-muted);border-right:1px solid var(--border-light);}
.day-header:last-child{border-right:none;}
.day-header.sun{color:#c44;}
.day-header.sat{color:#47a;}
.event-rows{position:relative;min-height:32px;}
.event-row{display:grid;height:30px;}
.event-cell{border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);}
.event-cell:last-child{border-right:none;}
/* Bars use grid placement inside a grid overlay */
.event-bar-row{display:grid;height:30px;position:relative;}
.event-bar-slot{position:relative;}
.event-bar{position:absolute;height:24px;top:3px;left:1px;right:1px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,0.2);transition:box-shadow 0.15s;-webkit-tap-highlight-color:transparent;user-select:none;}
.event-bar:hover,.event-bar:active{box-shadow:0 2px 8px rgba(0,0,0,0.25);}
.event-bar:active{transform:scale(0.97);}

/* ===== Inline Edit Popup ===== */
.inline-popup{position:fixed;z-index:150;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);border:1px solid var(--border);width:320px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity 0.15s,transform 0.15s;transform:translateY(4px);}
.inline-popup.active{opacity:1;pointer-events:all;transform:translateY(0);}
.inline-popup-header{padding:12px 14px 0;display:flex;align-items:center;justify-content:space-between;}
.inline-popup-title{font-size:14px;font-weight:700;font-family:'Zen Maru Gothic',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inline-popup-body{padding:10px 14px;}
.inline-popup-body .form-group{margin-bottom:10px;}
.inline-popup-body label{display:block;font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:3px;}
.inline-popup-body input{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;color:var(--text);}
.inline-popup-body input:focus{outline:none;border-color:var(--accent);}
.inline-popup-footer{padding:0 14px 12px;display:flex;gap:6px;justify-content:space-between;}
.inline-cat-row{display:flex;gap:4px;flex-wrap:wrap;}
.inline-cat-btn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.1s;}
.inline-cat-btn:hover{transform:scale(1.15);}
.inline-cat-btn.selected{border-color:var(--text);transform:scale(1.15);}
.popup-backdrop{position:fixed;inset:0;z-index:140;background:transparent;}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(44,40,32,0.4);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;padding:16px;}
.modal-overlay.active{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:440px;max-width:100%;max-height:90vh;overflow-y:auto;transform:translateY(10px);transition:transform 0.2s;}
.modal-overlay.active .modal{transform:translateY(0);}
.modal-header{padding:18px 20px 0;font-family:'Zen Maru Gothic',serif;font-size:16px;font-weight:700;}
.modal-body{padding:16px 20px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:4px;}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);}
.form-row{display:flex;gap:10px;}
.form-row .form-group{flex:1;}
.modal-footer{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end;}
.category-options{display:flex;gap:6px;flex-wrap:wrap;}
.category-option{display:flex;align-items:center;gap:5px;padding:5px 10px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:12px;transition:all 0.15s;font-family:inherit;background:var(--surface);}
.category-option:hover{border-color:var(--text-muted);}
.category-option.selected{border-color:var(--accent);background:var(--accent-light);}
.category-dot{width:12px;height:12px;border-radius:50%;}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:300;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--danger);}

.empty-state{text-align:center;padding:30px 16px;color:var(--text-light);}
.empty-state p{font-size:13px;margin-top:8px;}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ===== FAB (mobile) ===== */
.fab{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;box-shadow:var(--shadow-md);cursor:pointer;z-index:90;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.fab:active{transform:scale(0.93);}

/* ===== Mobile ===== */
@media(max-width:768px){
  .header h1{font-size:14px;}
  .header{padding:8px 12px;}
  .menu-btn{display:flex;align-items:center;justify-content:center;}
  .main{position:relative;}
  .sidebar{position:fixed;top:53px;left:0;bottom:0;z-index:80;transform:translateX(-100%);width:85vw;max-width:340px;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{position:fixed;inset:0;top:53px;background:rgba(0,0,0,0.3);z-index:79;display:none;}
  .sidebar-backdrop.show{display:block;}
  .calendar-area{padding:10px;}
  .month-block{margin-bottom:14px;}
  .fab{display:flex;}
  .desktop-only{display:none !important;}
  .event-item-actions{opacity:1;}
  .user-badge{display:none;}
  .sync-status span:not(.sync-dot){display:none;}
  .day-header{font-size:10px;}
  .event-bar{font-size:10px;height:22px;top:4px;}
  .event-row{height:28px;}
  /* Mobile: inline popup becomes full modal */
  .popup-backdrop{background:rgba(44,40,32,0.4) !important;}
  .inline-popup{width:92vw;max-width:400px;top:50% !important;left:50% !important;transform:translate(-50%,-50%) !important;border-radius:var(--radius-lg);max-height:85vh;overflow-y:auto;}
  .inline-popup.active{transform:translate(-50%,-50%) !important;}
  .inline-popup-body input{font-size:16px;padding:10px 12px;}
  .inline-popup-footer{flex-wrap:wrap;gap:8px;}
  .inline-cat-btn{width:28px;height:28px;}
}
@media(max-width:380px){
  .header h1{font-size:13px;}
  .header-actions .btn-sm{padding:6px 8px;font-size:11px;}
}

/* ===== Shift UI ===== */
.shift-modal-overlay{position:fixed;inset:0;background:rgba(44,40,32,0.45);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;padding:10px;}
.shift-modal-overlay.active{opacity:1;pointer-events:all;}
.shift-modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:600px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;transform:translateY(10px);transition:transform 0.2s;}
.shift-modal-overlay.active .shift-modal{transform:translateY(0);}
.shift-modal-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;}
.shift-modal-header h3{font-family:'Zen Maru Gothic',serif;font-size:15px;font-weight:700;}
.shift-modal-body{flex:1;overflow-y:auto;padding:0;}
.shift-date-row{display:flex;align-items:flex-start;border-bottom:1px solid var(--border-light);padding:8px 16px;gap:10px;}
.shift-date-row:last-child{border-bottom:none;}
.shift-date-label{width:70px;min-width:70px;font-size:12px;font-weight:600;padding-top:4px;color:var(--text);}
.shift-date-label .dow{font-size:10px;font-weight:400;color:var(--text-muted);}
.shift-date-label .dow.sun{color:#c44;}
.shift-date-label .dow.sat{color:#47a;}
.shift-members{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:30px;}
.shift-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:500;cursor:default;transition:opacity 0.1s;}
.shift-tag .remove-tag{cursor:pointer;opacity:0.6;font-size:13px;line-height:1;margin-left:2px;}
.shift-tag .remove-tag:hover{opacity:1;}
.shift-add-member{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border:1px dashed var(--border);border-radius:12px;font-size:11px;color:var(--text-muted);cursor:pointer;background:transparent;font-family:inherit;transition:all 0.15s;}
.shift-add-member:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.shift-member-picker{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:210;max-height:200px;overflow-y:auto;min-width:140px;}
.shift-member-picker-item{padding:6px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.1s;}
.shift-member-picker-item:hover{background:var(--surface-alt);}
.shift-member-picker-item .mem-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.shift-member-picker-input{padding:6px 10px;border:none;border-bottom:1px solid var(--border-light);width:100%;font-size:12px;font-family:inherit;color:var(--text);outline:none;}
.shift-modal-footer{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;}

/* Member management */
.member-manage-section{padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--surface-alt);}
.member-manage-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.member-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;border:1px solid var(--border);}
.member-chip .remove-mem{cursor:pointer;opacity:0.5;font-size:12px;}
.member-chip .remove-mem:hover{opacity:1;color:var(--danger);}
.member-add-inline{display:inline-flex;gap:4px;align-items:center;}
.member-add-inline input{padding:3px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;width:80px;font-family:inherit;}
.member-add-inline input:focus{outline:none;border-color:var(--accent);}

/* Bar shift indicator */
.bar-shift-dots{display:flex;gap:1px;margin-left:4px;flex-shrink:0;}
.bar-shift-dot{width:6px;height:6px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);}

@media(max-width:768px){
  .shift-modal{width:100%;max-width:100%;max-height:85vh;margin:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0;align-self:flex-end;}
  .shift-date-row{padding:6px 12px;}
  .shift-date-label{width:55px;min-width:55px;font-size:11px;}
}

/* ===== Print ===== */
@media print{
  @page{size:A4 landscape;margin:6mm 8mm;}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:9px;}
  .header,.sidebar,.sidebar-backdrop,.fab,.inline-popup,.popup-backdrop,.modal-overlay,.setup-overlay,.toast,.shift-modal-overlay,.shift-member-picker{display:none !important;}
  .main{display:block;height:auto;}
  .calendar-area{padding:0;overflow:visible;}
  .calendar-scroll{overflow:visible;}
  .month-block{break-inside:avoid;page-break-inside:avoid;margin-bottom:6px;box-shadow:none;border:1px solid #bbb;border-radius:4px;}
  .month-header{font-size:11px;padding:4px 10px;background:#f0ede6 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .month-add-btn{display:none !important;}
  .day-header{font-size:8px;padding:2px 0;min-width:0;}
  .day-header span{font-size:6px !important;}
  .event-rows{min-height:18px;}
  .event-row{height:18px;}
  .event-bar-row{height:18px;}
  .event-bar{height:14px;top:2px;font-size:7px;padding:0 2px;border-radius:2px;left:0;right:0;}
  .event-cell{border-color:#ddd;}
}
</style>
</head>
<body>

<!-- Setup -->
<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <h1>催事スケジュール管理</h1>
    <p>初回セットアップ: GASのデプロイURLとあなたの名前を設定してください。</p>
    <div class="form-group">
      <label>GAS デプロイURL</label>
      <input type="url" id="setupUrl" placeholder="https://script.google.com/macros/s/xxxxx/exec">
    </div>
    <div class="form-group">
      <label>あなたの名前</label>
      <input type="text" id="setupName" placeholder="例: 竜矢">
    </div>
    <button class="btn btn-primary" onclick="completeSetup()">接続テスト & 開始</button>
    <div class="setup-error" id="setupError"></div>
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">&#9776;</button>
    <h1>催事管理</h1>
    <select class="year-select" id="yearSelect"></select>
  </div>
  <div class="header-actions">
    <div class="sync-status">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">同期中...</span>
    </div>
    <span class="user-badge" id="userBadge"></span>
    <button class="btn btn-secondary btn-sm" onclick="manualSync()">再読込</button>
    <button class="btn btn-primary btn-sm" onclick="exportExcel()">Excel</button>
    <button class="btn btn-secondary btn-sm" onclick="window.print()">印刷</button>
    <button class="btn btn-secondary btn-sm" onclick="showSettings()">設定</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>催事一覧</h2>
      <span class="event-count" id="eventCount">0件</span>
    </div>
    <div class="sidebar-filters" id="filterArea">
      <button class="filter-chip active" data-cat="all">全て</button>
      <button class="filter-chip" data-cat="tokai">東海</button>
      <button class="filter-chip" data-cat="kanto">関東</button>
      <button class="filter-chip" data-cat="kansai">関西</button>
      <button class="filter-chip" data-cat="other">その他</button>
      <button class="filter-chip" data-cat="special">特別</button>
    </div>
    <div class="event-list" id="eventList"></div>
    <details class="import-section">
      <summary>一括入力（テキスト）</summary>
      <div class="import-area">
        <textarea id="bulkInput" placeholder="催事名, 開始日, 終了日, カテゴリ&#10;栄三越, 1/5, 1/18, 東海"></textarea>
        <div class="import-hint">1行1催事。カンマ区切り。<br>カテゴリ: 東海/関東/関西/その他/特別</div>
        <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="bulkImport()">一括登録</button>
      </div>
    </details>
    <div class="sidebar-footer">
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="openAddModal();closeSidebar();">+ 催事を追加</button>
    </div>
  </div>
  <div class="calendar-area" id="calendarArea"></div>
</div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()">+</button>

<!-- Inline Edit Popup -->
<div class="popup-backdrop" id="popupBackdrop" onclick="closeInlinePopup()" style="display:none"></div>
<div class="inline-popup" id="inlinePopup">
  <div class="inline-popup-header">
    <span class="inline-popup-title" id="inlineTitle">編集</span>
    <button class="icon-btn delete" onclick="inlineDelete()" title="削除" style="flex-shrink:0">&#10005;</button>
  </div>
  <div class="inline-popup-body">
    <div class="form-group">
      <label>催事名</label>
      <input type="text" id="inlineName">
    </div>
    <div class="form-row">
      <div class="form-group"><label>開始日</label><input type="date" id="inlineStart"></div>
      <div class="form-group"><label>終了日</label><input type="date" id="inlineEnd"></div>
    </div>
    <div class="form-group">
      <label>カテゴリ</label>
      <div class="inline-cat-row" id="inlineCatRow"></div>
    </div>
    <div class="form-group">
      <label>備考</label>
      <input type="text" id="inlineNote" placeholder="任意">
    </div>
  </div>
  <div class="inline-popup-footer">
    <button class="btn btn-secondary btn-sm" onclick="openShiftModal(inlineEditId)">シフト管理</button>
    <div style="display:flex;gap:6px">
      <button class="btn btn-secondary btn-sm" onclick="closeInlinePopup()">キャンセル</button>
      <button class="btn btn-primary btn-sm" onclick="inlineSave()">更新</button>
    </div>
  </div>
</div>

<!-- Full Modal (for add / mobile fallback) -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header" id="modalTitle">催事を追加</div>
    <div class="modal-body">
      <div class="form-group"><label>催事名</label><input type="text" id="eventName" placeholder="例: 栄三越"></div>
      <div class="form-row">
        <div class="form-group"><label>開始日</label><input type="date" id="eventStart"></div>
        <div class="form-group"><label>終了日</label><input type="date" id="eventEnd"></div>
      </div>
      <div class="form-group">
        <label>カテゴリ（色分け）</label>
        <div class="category-options" id="categoryOptions">
          <button class="category-option" data-cat="tokai" onclick="selectCategory('tokai')"><span class="category-dot" style="background:var(--cat-tokai)"></span>東海</button>
          <button class="category-option" data-cat="kanto" onclick="selectCategory('kanto')"><span class="category-dot" style="background:var(--cat-kanto)"></span>関東</button>
          <button class="category-option" data-cat="kansai" onclick="selectCategory('kansai')"><span class="category-dot" style="background:var(--cat-kansai)"></span>関西</button>
          <button class="category-option" data-cat="other" onclick="selectCategory('other')"><span class="category-dot" style="background:var(--cat-other)"></span>その他</button>
          <button class="category-option" data-cat="special" onclick="selectCategory('special')"><span class="category-dot" style="background:var(--cat-special)"></span>特別</button>
        </div>
      </div>
      <div class="form-group"><label>備考</label><input type="text" id="eventNote" placeholder="任意"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveEvent()">追加</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-header">設定</div>
    <div class="modal-body">
      <div class="form-group"><label>GAS デプロイURL</label><input type="url" id="settingsUrl"></div>
      <div class="form-group"><label>ユーザー名</label><input type="text" id="settingsName"></div>
      <div class="form-group" style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border-light)">
        <label>データ管理</label>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="exportJSON()">JSONバックアップ</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('jsonImport').click()">JSON復元</button>
          <input type="file" id="jsonImport" accept=".json" style="display:none" onchange="importJSON(event)">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Shift Modal -->
<div class="shift-modal-overlay" id="shiftOverlay" onclick="if(event.target===this)closeShiftModal()">
  <div class="shift-modal">
    <div class="shift-modal-header">
      <h3 id="shiftModalTitle">シフト管理</h3>
      <button class="icon-btn" onclick="closeShiftModal()" style="font-size:18px">&times;</button>
    </div>
    <div class="member-manage-section">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:500">登録メンバー</div>
      <div class="member-manage-row" id="memberManageRow"></div>
    </div>
    <div class="shift-modal-body" id="shiftBody"></div>
    <div class="shift-modal-footer">
      <span style="font-size:11px;color:var(--text-muted)" id="shiftStatus"></span>
      <button class="btn btn-secondary btn-sm" onclick="closeShiftModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
// ===== State =====
let GAS_URL='',USER_NAME='',events=[],shifts=[],members=[],currentYear=new Date().getFullYear(),editingId=null,selectedCategory='tokai',filterCategory='all',syncInterval=null,isSyncing=false,inlineEditId=null,inlineEditCat='tokai';
const CAT_COLORS={tokai:{bg:'#4a7ab5',light:'#dce8f4',label:'東海'},kanto:{bg:'#5a9e6f',light:'#ddf0e3',label:'関東'},kansai:{bg:'#c47d2e',light:'#f5e8d4',label:'関西'},other:{bg:'#888888',light:'#e8e8e8',label:'その他'},special:{bg:'#9b59b6',light:'#ede0f4',label:'特別'}};
const MEMBER_COLORS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e84393','#00b894','#6c5ce7','#fd79a8','#00cec9'];
function generateId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function isMobile(){return window.innerWidth<=768;}

// ===== Sidebar toggle =====
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarBackdrop').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('show');}

// ===== Setup =====
function checkSetup(){
  GAS_URL=localStorage.getItem('saiji_gas_url')||'';USER_NAME=localStorage.getItem('saiji_user_name')||'';
  if(!GAS_URL||!USER_NAME){document.getElementById('setupOverlay').classList.remove('hidden');document.getElementById('setupUrl').value=GAS_URL;document.getElementById('setupName').value=USER_NAME;}
  else{document.getElementById('setupOverlay').classList.add('hidden');document.getElementById('userBadge').textContent=USER_NAME;startApp();}
}
async function completeSetup(){
  const url=document.getElementById('setupUrl').value.trim(),name=document.getElementById('setupName').value.trim(),err=document.getElementById('setupError');
  err.style.display='none';
  if(!url||!name){err.textContent='URLと名前を両方入力してください。';err.style.display='block';err.style.color='var(--danger)';return;}
  err.textContent='接続テスト中...';err.style.display='block';err.style.color='var(--text-muted)';
  try{const r=await fetch(url);const d=await r.json();if(d.success!==undefined){localStorage.setItem('saiji_gas_url',url);localStorage.setItem('saiji_user_name',name);GAS_URL=url;USER_NAME=name;document.getElementById('setupOverlay').classList.add('hidden');document.getElementById('userBadge').textContent=USER_NAME;startApp();}else throw new Error('不正なレスポンス');}
  catch(e){err.textContent='接続失敗: '+e.message;err.style.color='var(--danger)';err.style.display='block';}
}
function showSettings(){document.getElementById('settingsUrl').value=GAS_URL;document.getElementById('settingsName').value=USER_NAME;document.getElementById('settingsOverlay').classList.add('active');}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('active');}
function saveSettings(){const u=document.getElementById('settingsUrl').value.trim(),n=document.getElementById('settingsName').value.trim();if(u){GAS_URL=u;localStorage.setItem('saiji_gas_url',u);}if(n){USER_NAME=n;localStorage.setItem('saiji_user_name',n);document.getElementById('userBadge').textContent=n;}closeSettings();showToast('設定を保存しました');fetchEvents();}

// ===== API =====
function setSyncStatus(s,t){document.getElementById('syncDot').className='sync-dot'+(s==='loading'?' loading':s==='error'?' error':'');document.getElementById('syncText').textContent=t;}
async function fetchEvents(){
  if(isSyncing)return;isSyncing=true;setSyncStatus('loading','同期中...');
  try{const r=await fetch(GAS_URL);const d=await r.json();
    if(d.success){
      if(d.events)events=d.events.map(ev=>({id:String(ev.id),name:String(ev.name),start:normDate(ev.start),end:normDate(ev.end),category:String(ev.category||'other'),note:String(ev.note||'')}));
      if(d.shifts)shifts=d.shifts.map(sh=>({eventId:String(sh.eventId),date:normDate(sh.date),memberName:String(sh.memberName)}));
      if(d.members)members=d.members.map(m=>({name:String(m.name),color:String(m.color||'')}));
      render();const n=new Date();setSyncStatus('ok',n.getHours()+':'+String(n.getMinutes()).padStart(2,'0'));
    }else setSyncStatus('error','取得失敗');
  }catch(e){setSyncStatus('error','接続エラー');console.error(e);}isSyncing=false;
}
async function apiPost(body){
  try{setSyncStatus('loading','保存中...');
    const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...body,user:USER_NAME})});
    const d=await r.json();if(d.success){await fetchEvents();return true;}else{setSyncStatus('error','保存失敗');showToast('保存失敗: '+(d.error||''),true);return false;}
  }catch(e){setSyncStatus('error','接続エラー');showToast('通信エラー',true);return false;}
}
function manualSync(){fetchEvents();}

// ===== Year =====
function initYearSelect(){const s=document.getElementById('yearSelect');for(let y=currentYear-1;y<=currentYear+2;y++){const o=document.createElement('option');o.value=y;o.textContent=y+'年';if(y===currentYear)o.selected=true;s.appendChild(o);}s.addEventListener('change',()=>{currentYear=parseInt(s.value);render();});}

// ===== Render =====
function render(){renderEventList();renderCalendar();}
function getFilteredEvents(){
  let f=events.filter(e=>{const s=new Date(e.start),en=new Date(e.end);return s.getFullYear()===currentYear||en.getFullYear()===currentYear;});
  if(filterCategory!=='all')f=f.filter(e=>e.category===filterCategory);return f.sort((a,b)=>new Date(a.start)-new Date(b.start));
}
function renderEventList(){
  const list=document.getElementById('eventList'),filtered=getFilteredEvents();
  document.getElementById('eventCount').textContent=filtered.length+'件';
  if(!filtered.length){list.innerHTML='<div class="empty-state"><p>催事がありません</p></div>';return;}
  list.innerHTML=filtered.map(ev=>{const c=CAT_COLORS[ev.category]||CAT_COLORS.other,s=new Date(ev.start),en=new Date(ev.end);
    return `<div class="event-item" onclick="scrollToEvent('${ev.id}');closeSidebar();">
      <span class="event-color-dot" style="background:${c.bg}"></span>
      <div class="event-item-info"><div class="event-item-name">${esc(ev.name)}</div><div class="event-item-date">${s.getMonth()+1}/${s.getDate()} - ${en.getMonth()+1}/${en.getDate()}</div></div>
      <div class="event-item-actions">
        <button class="icon-btn" onclick="event.stopPropagation();openBarEdit('${ev.id}')" title="編集">&#9998;</button>
        <button class="icon-btn delete" onclick="event.stopPropagation();deleteEvent('${ev.id}')" title="削除">&#10005;</button>
      </div></div>`;
  }).join('');
}
function renderCalendar(){
  const area=document.getElementById('calendarArea'),dn=['日','月','火','水','木','金','土'];let html='';
  for(let m=0;m<12;m++){
    const dim=new Date(currentYear,m+1,0).getDate(),me=getEventsForMonth(m),rows=assignRows(me),maxR=rows.length?Math.max(...rows.map(r=>r.row))+1:1;
    const gridCols=`repeat(${dim},minmax(32px,1fr))`;
    html+=`<div class="month-block" id="month-${m}"><div class="month-header"><span>${currentYear}年 ${m+1}月</span><button class="month-add-btn" onclick="openAddModalForMonth(${m})" title="${m+1}月に追加">+</button></div><div class="calendar-scroll">`;
    // Day headers
    html+=`<div class="day-header-row" style="grid-template-columns:${gridCols}">`;
    for(let d=1;d<=dim;d++){const dow=new Date(currentYear,m,d).getDay();html+=`<div class="day-header${dow===0?' sun':dow===6?' sat':''}">${d}<br><span style="font-size:9px">${dn[dow]}</span></div>`;}
    html+='</div>';
    // Background grid cells (for borders)
    html+=`<div class="event-rows" data-rows="${maxR}" style="height:${maxR*30}px">`;
    for(let r=0;r<maxR;r++){html+=`<div class="event-row" style="grid-template-columns:${gridCols}">`;for(let d=1;d<=dim;d++)html+='<div class="event-cell"></div>';html+='</div>';}
    // Bar rows using grid-column
    for(let r=0;r<maxR;r++){
      const rowItems=rows.filter(i=>i.row===r);
      if(!rowItems.length)continue;
      html+=`<div class="event-bar-row" style="grid-template-columns:${gridCols};position:absolute;top:${r*30}px;left:0;right:0">`;
      for(const item of rowItems){const ev=item.event,c=CAT_COLORS[ev.category]||CAT_COLORS.other;
        const evShifts=getShiftsForEvent(ev.id);
        const shiftCount=new Set(evShifts.map(s=>s.memberName)).size;
        const shiftBadge=shiftCount>0?`<span style="margin-left:auto;font-size:9px;opacity:0.85;flex-shrink:0;padding-left:3px">${shiftCount}名</span>`:'';
        html+=`<div class="event-bar-slot" style="grid-column:${item.startDay}/${item.endDay+1}"><div class="event-bar" data-eid="${ev.id}" style="background:${c.bg}" onclick="openBarEdit('${ev.id}',event)" title="${esc(ev.name)}">${esc(ev.name)}${shiftBadge}</div></div>`;}
      html+='</div>';
    }
    html+='</div></div></div>';
  }
  area.innerHTML=html;
}
function getEventsForMonth(m){
  return events.filter(ev=>{const s=new Date(ev.start),e=new Date(ev.end);return s<=new Date(currentYear,m+1,0)&&e>=new Date(currentYear,m,1);})
    .map(ev=>{const s=new Date(ev.start),e=new Date(ev.end),dim=new Date(currentYear,m+1,0).getDate();return{event:ev,startDay:Math.max(1,s.getFullYear()===currentYear&&s.getMonth()===m?s.getDate():1),endDay:Math.min(dim,e.getFullYear()===currentYear&&e.getMonth()===m?e.getDate():dim)};})
    .sort((a,b)=>a.startDay-b.startDay||(b.endDay-b.startDay)-(a.endDay-a.startDay));
}
function assignRows(me){const re=[];return me.map(item=>{let r=0;while(r<re.length&&re[r]>=item.startDay)r++;if(r>=re.length)re.push(0);re[r]=item.endDay;return{...item,row:r};});}

// ===== Inline Popup Edit (on bar click) =====
function openBarEdit(id,evt){
  const ev=events.find(e=>e.id===id);if(!ev)return;
  inlineEditId=id;inlineEditCat=ev.category;
  const popup=document.getElementById('inlinePopup');
  document.getElementById('inlineTitle').textContent=ev.name;
  document.getElementById('inlineName').value=ev.name;
  document.getElementById('inlineStart').value=ev.start;
  document.getElementById('inlineEnd').value=ev.end;
  document.getElementById('inlineNote').value=ev.note||'';
  // category buttons
  let catHtml='';for(const[k,v]of Object.entries(CAT_COLORS)){catHtml+=`<button class="inline-cat-btn${k===ev.category?' selected':''}" style="background:${v.bg}" data-cat="${k}" onclick="selectInlineCat('${k}')" title="${v.label}"></button>`;}
  document.getElementById('inlineCatRow').innerHTML=catHtml;
  // Position popup
  const bd=document.getElementById('popupBackdrop');bd.style.display='block';
  if(isMobile()){
    // Mobile: center on screen (CSS handles positioning)
    popup.style.top='';popup.style.left='';popup.style.transform='';
  }else if(evt&&evt.target){
    const rect=evt.target.getBoundingClientRect();
    let top=rect.bottom+6,left=rect.left;
    const pw=320,ph=380;
    if(left+pw>window.innerWidth)left=window.innerWidth-pw-10;
    if(left<10)left=10;
    if(top+ph>window.innerHeight)top=rect.top-ph-6;
    if(top<10)top=10;
    popup.style.top=top+'px';popup.style.left=left+'px';popup.style.transform='';
  }else{
    popup.style.top='50%';popup.style.left='50%';popup.style.transform='translate(-50%,-50%)';
  }
  popup.classList.add('active');
  setTimeout(()=>document.getElementById('inlineName').focus(),100);
}
function closeInlinePopup(){document.getElementById('inlinePopup').classList.remove('active');document.getElementById('popupBackdrop').style.display='none';document.getElementById('inlinePopup').style.transform='';inlineEditId=null;}
function selectInlineCat(cat){inlineEditCat=cat;document.querySelectorAll('.inline-cat-btn').forEach(b=>b.classList.toggle('selected',b.dataset.cat===cat));}
async function inlineSave(){
  const name=document.getElementById('inlineName').value.trim(),start=document.getElementById('inlineStart').value,end=document.getElementById('inlineEnd').value,note=document.getElementById('inlineNote').value.trim();
  if(!name){showToast('催事名を入力してください',true);return;}if(!start||!end){showToast('日付を入力してください',true);return;}
  if(new Date(end)<new Date(start)){showToast('終了日は開始日以降にしてください',true);return;}
  closeInlinePopup();await apiPost({action:'update',event:{id:inlineEditId,name,start,end,category:inlineEditCat,note}});showToast('更新しました');
}
async function inlineDelete(){
  const ev=events.find(e=>e.id===inlineEditId);if(!confirm(`「${ev?ev.name:''}」を削除しますか？`))return;
  closeInlinePopup();await apiPost({action:'delete',id:inlineEditId});showToast('削除しました');
}

// ===== Full Modal =====
function openAddModal(){
  editingId=null;document.getElementById('modalTitle').textContent='催事を追加';document.getElementById('modalSaveBtn').textContent='追加';
  document.getElementById('eventName').value='';document.getElementById('eventStart').value=`${currentYear}-01-01`;document.getElementById('eventEnd').value=`${currentYear}-01-07`;document.getElementById('eventNote').value='';
  selectCategory('tokai');document.getElementById('modalOverlay').classList.add('active');setTimeout(()=>document.getElementById('eventName').focus(),100);
}
function openAddModalForMonth(m){
  editingId=null;document.getElementById('modalTitle').textContent=`${m+1}月に催事を追加`;document.getElementById('modalSaveBtn').textContent='追加';
  document.getElementById('eventName').value='';document.getElementById('eventStart').value=`${currentYear}-${String(m+1).padStart(2,'0')}-01`;
  const dim=new Date(currentYear,m+1,0).getDate();document.getElementById('eventEnd').value=`${currentYear}-${String(m+1).padStart(2,'0')}-${String(Math.min(7,dim)).padStart(2,'0')}`;
  document.getElementById('eventNote').value='';selectCategory('tokai');document.getElementById('modalOverlay').classList.add('active');setTimeout(()=>document.getElementById('eventName').focus(),100);
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('active');editingId=null;}
function selectCategory(cat){selectedCategory=cat;document.querySelectorAll('.category-option').forEach(el=>el.classList.toggle('selected',el.dataset.cat===cat));}
async function saveEvent(){
  const name=document.getElementById('eventName').value.trim(),start=document.getElementById('eventStart').value,end=document.getElementById('eventEnd').value,note=document.getElementById('eventNote').value.trim();
  if(!name){showToast('催事名を入力してください',true);return;}if(!start||!end){showToast('日付を入力してください',true);return;}
  if(new Date(end)<new Date(start)){showToast('終了日は開始日以降にしてください',true);return;}
  closeModal();await apiPost({action:'add',event:{id:generateId(),name,start,end,category:selectedCategory,note}});showToast('追加しました');
}
async function deleteEvent(id){const ev=events.find(e=>e.id===id);if(!confirm(`「${ev?ev.name:''}」を削除しますか？`))return;await apiPost({action:'delete',id});showToast('削除しました');}
function scrollToEvent(id){const ev=events.find(e=>e.id===id);if(!ev)return;const m=new Date(ev.start).getMonth(),bl=document.getElementById('month-'+m);if(bl)bl.scrollIntoView({behavior:'smooth',block:'start'});}

// ===== Filters =====
document.getElementById('filterArea').addEventListener('click',e=>{const c=e.target.closest('.filter-chip');if(!c)return;filterCategory=c.dataset.cat;document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');render();});

// ===== Bulk Import =====
async function bulkImport(){
  const text=document.getElementById('bulkInput').value.trim();if(!text)return;
  const cm={'東海':'tokai','関東':'kanto','関西':'kansai','その他':'other','特別':'special'};
  const lines=text.split('\n').filter(l=>l.trim()),ne=[];
  for(const line of lines){const p=line.split(',').map(s=>s.trim());if(p.length<3)continue;const[name,ss,es,cs]=p;const cat=cm[cs]||'other';
    const sm=ss.match(/(\d+)\/(\d+)/),em=es.match(/(\d+)\/(\d+)/);if(!sm||!em)continue;
    ne.push({id:generateId(),name,start:`${currentYear}-${sm[1].padStart(2,'0')}-${sm[2].padStart(2,'0')}`,end:`${currentYear}-${em[1].padStart(2,'0')}-${em[2].padStart(2,'0')}`,category:cat,note:''});}
  if(!ne.length){showToast('有効なデータがありません',true);return;}
  await apiPost({action:'sync',events:[...events,...ne]});document.getElementById('bulkInput').value='';showToast(ne.length+'件登録しました');
}

// ===== Excel =====
async function exportExcel(){
  showToast('Excel生成中...');const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('催事表');
  const ec={tokai:{bg:'4472C4',font:'FFFFFF'},kanto:{bg:'70AD47',font:'FFFFFF'},kansai:{bg:'ED7D31',font:'FFFFFF'},other:{bg:'A5A5A5',font:'FFFFFF'},special:{bg:'9B59B6',font:'FFFFFF'}};
  const dhFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF2ECDE'}},dhFont={name:'游ゴシック',size:10},mFont={name:'游ゴシック',size:11,bold:true},eFont={name:'游ゴシック',size:9};
  const tb={style:'thin',color:{argb:'FFD0D0D0'}},cb={left:tb,right:tb,top:tb,bottom:tb};
  for(let c=1;c<=31;c++)ws.getColumn(c).width=4.5;
  let cr=1;const dn=['日','月','火','水','木','金','土'];
  for(let m=0;m<12;m++){
    const dim=new Date(currentYear,m+1,0).getDate(),me=getEventsForMonth(m),rows=assignRows(me),maxR=rows.length?Math.max(...rows.map(r=>r.row))+1:1;
    ws.getCell(cr,Math.ceil(dim/2)).value=`${currentYear}   ${m+1}月`;ws.getCell(cr,Math.ceil(dim/2)).font=mFont;ws.getCell(cr,Math.ceil(dim/2)).alignment={vertical:'middle',horizontal:'center'};ws.getRow(cr).height=20;cr++;
    for(let d=1;d<=dim;d++){const c2=ws.getCell(cr,d),dow=new Date(currentYear,m,d).getDay();c2.value=d;c2.font={...dhFont,color:{argb:dow===0?'FFCC4444':dow===6?'FF4477AA':'FF333333'}};c2.fill=dhFill;c2.alignment={vertical:'middle',horizontal:'center'};c2.border=cb;}
    ws.getRow(cr).height=16;cr++;
    for(let r=0;r<maxR;r++){const ri=rows.filter(i=>i.row===r);ws.getRow(cr).height=19;for(let d=1;d<=dim;d++)ws.getCell(cr,d).border=cb;
      for(const item of ri){const ev=item.event,co=ec[ev.category]||ec.other;if(item.endDay>item.startDay)ws.mergeCells(cr,item.startDay,cr,item.endDay);const c2=ws.getCell(cr,item.startDay);c2.value=ev.name;c2.font={...eFont,color:{argb:'FF'+co.font}};c2.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+co.bg}};c2.alignment={vertical:'middle',horizontal:'center',wrapText:false};c2.border=cb;}cr++;}
    ws.getRow(cr).height=6;cr++;
  }
  const buf=await wb.xlsx.writeBuffer();downloadBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`催事表_${currentYear}.xlsx`);showToast('Excel出力しました');
}

// ===== Utils =====
function normDate(v){
  if(!v)return '';
  const s=String(v);
  // ISO形式やDate型から YYYY-MM-DD を抽出
  const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  // スプレッドシートの日付文字列（例: Mon Apr 01 2026...）
  const d=new Date(s);
  if(!isNaN(d.getTime()))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return s;
}
function downloadBlob(b,f){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=f;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showToast(m,isErr){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(isErr?' error':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2500);}

// ===== Keys =====
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePicker();closeShiftModal();closeModal();closeSettings();closeInlinePopup();}if(e.key==='n'&&(e.ctrlKey||e.metaKey)){e.preventDefault();openAddModal();}});

// ===== Print height adjustment =====
window.addEventListener('beforeprint',()=>{
  document.querySelectorAll('.event-rows').forEach(el=>{
    const rows=parseInt(el.dataset.rows)||1;
    el.style.height=(rows*18)+'px';
  });
  document.querySelectorAll('.event-bar-row').forEach(el=>{
    const curTop=parseInt(el.style.top)||0;
    el.dataset.origTop=curTop;
    el.style.top=Math.round(curTop/30*18)+'px';
  });
});
window.addEventListener('afterprint',()=>{
  document.querySelectorAll('.event-rows').forEach(el=>{
    const rows=parseInt(el.dataset.rows)||1;
    el.style.height=(rows*30)+'px';
  });
  document.querySelectorAll('.event-bar-row').forEach(el=>{
    el.style.top=(el.dataset.origTop||0)+'px';
  });
});

// ===== Start =====
function startApp(){fetchEvents();if(syncInterval)clearInterval(syncInterval);syncInterval=setInterval(fetchEvents,30000);}

// ===== Shift Management =====
let shiftEventId=null;
let pickerTarget=null;

function getShiftsForEvent(eventId){return shifts.filter(s=>s.eventId===eventId);}
function getShiftsForDate(eventId,date){return shifts.filter(s=>s.eventId===eventId&&s.date===date).map(s=>s.memberName);}
function getMemberColor(name){
  const m=members.find(mm=>mm.name===name);
  if(m&&m.color)return m.color;
  // Auto-assign color based on name hash
  let h=0;for(let i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);
  return MEMBER_COLORS[Math.abs(h)%MEMBER_COLORS.length];
}

function openShiftModal(eventId){
  const ev=events.find(e=>e.id===eventId);if(!ev)return;
  shiftEventId=eventId;
  closeInlinePopup();
  document.getElementById('shiftModalTitle').textContent=ev.name+' - シフト管理';
  renderMemberManage();
  renderShiftBody(ev);
  document.getElementById('shiftOverlay').classList.add('active');
}
function closeShiftModal(){document.getElementById('shiftOverlay').classList.remove('active');shiftEventId=null;closePicker();}

function renderMemberManage(){
  const row=document.getElementById('memberManageRow');
  let html=members.map(m=>{
    const col=m.color||getMemberColor(m.name);
    return `<span class="member-chip" style="background:${col}20;border-color:${col}60"><span style="color:${col}">${esc(m.name)}</span><span class="remove-mem" onclick="removeMember('${esc(m.name)}')">&times;</span></span>`;
  }).join('');
  html+=`<span class="member-add-inline"><input type="text" id="newMemberInput" placeholder="名前" onkeydown="if(event.key==='Enter')addNewMember()"><button class="btn btn-sm btn-secondary" onclick="addNewMember()" style="padding:3px 8px;font-size:10px">追加</button></span>`;
  row.innerHTML=html;
}

async function addNewMember(){
  const inp=document.getElementById('newMemberInput');
  const name=inp.value.trim();if(!name)return;
  const color=MEMBER_COLORS[members.length%MEMBER_COLORS.length];
  const ok=await apiPostSilent({action:'member_add',name,color});
  if(ok){members.push({name,color});renderMemberManage();renderShiftBody(events.find(e=>e.id===shiftEventId));}
  inp.value='';
}

async function removeMember(name){
  if(!confirm(`「${name}」をメンバーから削除しますか？`))return;
  await apiPostSilent({action:'member_remove',name});
  members=members.filter(m=>m.name!==name);
  renderMemberManage();renderShiftBody(events.find(e=>e.id===shiftEventId));
}

function renderShiftBody(ev){
  if(!ev)return;
  const body=document.getElementById('shiftBody');
  const s=new Date(ev.start),e=new Date(ev.end);
  const dn=['日','月','火','水','木','金','土'];
  let html='';
  const cur=new Date(s);
  while(cur<=e){
    const dateStr=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    const dow=cur.getDay();
    const dowCls=dow===0?' sun':dow===6?' sat':'';
    const dayShifts=getShiftsForDate(ev.id,dateStr);
    html+=`<div class="shift-date-row">`;
    html+=`<div class="shift-date-label">${cur.getMonth()+1}/${cur.getDate()}<span class="dow${dowCls}"> ${dn[dow]}</span></div>`;
    html+=`<div class="shift-members" data-eid="${ev.id}" data-date="${dateStr}">`;
    for(const name of dayShifts){
      const col=getMemberColor(name);
      html+=`<span class="shift-tag" style="background:${col}25;color:${col}">${esc(name)}<span class="remove-tag" onclick="removeShiftMember('${ev.id}','${dateStr}','${esc(name)}')">&times;</span></span>`;
    }
    html+=`<button class="shift-add-member" onclick="openPicker(this,'${ev.id}','${dateStr}')">+ 追加</button>`;
    html+=`</div></div>`;
    cur.setDate(cur.getDate()+1);
  }
  body.innerHTML=html;
  // Count
  const totalShifts=getShiftsForEvent(ev.id).length;
  document.getElementById('shiftStatus').textContent=`${totalShifts}件のシフト登録済`;
}

// Member picker dropdown
function openPicker(btn,eventId,date){
  closePicker();
  const picker=document.createElement('div');
  picker.className='shift-member-picker';picker.id='activePicker';
  const rect=btn.getBoundingClientRect();
  picker.style.position='fixed';
  picker.style.top=(rect.bottom+2)+'px';
  picker.style.left=rect.left+'px';
  if(rect.left+160>window.innerWidth)picker.style.left=(window.innerWidth-170)+'px';
  if(rect.bottom+220>window.innerHeight){picker.style.top='';picker.style.bottom=(window.innerHeight-rect.top+2)+'px';}

  const currentMembers=getShiftsForDate(eventId,date);
  // Search input
  let html=`<input class="shift-member-picker-input" id="pickerSearch" placeholder="検索/新規入力" oninput="filterPicker()">`;
  // Registered members
  const available=members.filter(m=>!currentMembers.includes(m.name));
  html+='<div id="pickerList">';
  for(const m of available){
    const col=m.color||getMemberColor(m.name);
    html+=`<div class="shift-member-picker-item" onclick="pickMember('${eventId}','${date}','${esc(m.name)}')"><span class="mem-dot" style="background:${col}"></span>${esc(m.name)}</div>`;
  }
  html+='</div>';
  picker.innerHTML=html;
  document.body.appendChild(picker);
  pickerTarget={eventId,date};
  setTimeout(()=>document.getElementById('pickerSearch').focus(),50);

  // Close on outside click
  const handler=e=>{if(!picker.contains(e.target)&&e.target!==btn){closePicker();document.removeEventListener('mousedown',handler);}};
  setTimeout(()=>document.addEventListener('mousedown',handler),10);
}

function filterPicker(){
  const q=document.getElementById('pickerSearch').value.trim().toLowerCase();
  const list=document.getElementById('pickerList');if(!list||!pickerTarget)return;
  const currentMembers=getShiftsForDate(pickerTarget.eventId,pickerTarget.date);
  const available=members.filter(m=>!currentMembers.includes(m.name)&&m.name.toLowerCase().includes(q));
  let html='';
  for(const m of available){
    const col=m.color||getMemberColor(m.name);
    html+=`<div class="shift-member-picker-item" onclick="pickMember('${pickerTarget.eventId}','${pickerTarget.date}','${esc(m.name)}')"><span class="mem-dot" style="background:${col}"></span>${esc(m.name)}</div>`;
  }
  // If no match and has input, allow adding as temp member
  if(q&&!members.find(m=>m.name.toLowerCase()===q)){
    html+=`<div class="shift-member-picker-item" onclick="pickNewMember('${pickerTarget.eventId}','${pickerTarget.date}')" style="color:var(--accent);font-weight:500">+ 「${esc(document.getElementById('pickerSearch').value.trim())}」を追加</div>`;
  }
  list.innerHTML=html;
}

async function pickMember(eventId,date,name){
  closePicker();
  const current=getShiftsForDate(eventId,date);
  current.push(name);
  // Update local state immediately for responsiveness
  shifts.push({eventId,date,memberName:name});
  renderShiftBody(events.find(e=>e.id===eventId));
  // Persist
  await apiPostSilent({action:'shift_set',eventId,date,members:current});
}

async function pickNewMember(eventId,date){
  const name=document.getElementById('pickerSearch').value.trim();if(!name)return;
  closePicker();
  // Add to members if not exists
  if(!members.find(m=>m.name===name)){
    const color=MEMBER_COLORS[members.length%MEMBER_COLORS.length];
    members.push({name,color});
    await apiPostSilent({action:'member_add',name,color});
    renderMemberManage();
  }
  await pickMember(eventId,date,name);
}

async function removeShiftMember(eventId,date,name){
  const current=getShiftsForDate(eventId,date).filter(n=>n!==name);
  shifts=shifts.filter(s=>!(s.eventId===eventId&&s.date===date&&s.memberName===name));
  renderShiftBody(events.find(e=>e.id===eventId));
  await apiPostSilent({action:'shift_set',eventId,date,members:current});
}

function closePicker(){const p=document.getElementById('activePicker');if(p)p.remove();pickerTarget=null;}

// Silent API post (no full re-fetch, for shift operations)
async function apiPostSilent(body){
  try{
    const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...body,user:USER_NAME})});
    const d=await r.json();return d.success;
  }catch(e){showToast('通信エラー',true);return false;}
}

initYearSelect();checkSetup();
